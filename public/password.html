<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Link</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .password-card {
            max-width: 500px;
            width: 100%;
        }
        .lock-icon {
            text-align: center;
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="card password-card">
            <div class="lock-icon">🔒</div>
            <h2 style="text-align: center;">Password Protected Link</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">
                This link is password protected. Please enter the password to continue.
            </p>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    🔓 Unlock
                </button>
            </form>
            <div id="error" style="display: none; color: var(--danger-color); text-align: center; margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const currentPath = window.location.pathname;
            const shortCode = currentPath.substring(1);
            const errorDiv = document.getElementById('error');
            
            try {
                const response = await fetch(`/api/verify/${shortCode}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to the original URL
                    window.location.href = data.url;
                } else {
                    errorDiv.textContent = data.error || 'Incorrect password';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
